<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">بيزنس ريفيو | مستشار الأعمال والذكاء الاصطناعي</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; padding: 20px; }
        .wrapper { max-width: 900px; margin: 30px auto; }
        header { text-align: center; margin-bottom: 40px; position: relative; }
        .lang-switch { position: absolute; top: 0; left: 0; }
        [dir="ltr"] .lang-switch { left: auto; right: 0; }
        .lang-btn { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .brand-badge { display: inline-block; background: rgba(79, 70, 229, 0.15); color: #818cf8; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; border: 1px solid rgba(79, 70, 229, 0.3); }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #fff; }
        p.desc { color: var(--text-muted); font-size: 1.1rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #e5e7eb; text-align: start; }
        input[type="password"], textarea { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); background: #030712; color: #fff; font-size: 1rem; text-align: start; }
        textarea { height: 140px; resize: vertical; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 28px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: all 0.3s ease; }
        .btn:hover { background: var(--primary-hover); }
        .output-box { background: #030712; border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-top: 30px; display: none; white-space: pre-wrap; font-size: 1rem; color: #e5e7eb; line-height: 1.8; text-align: start; }
        .loading { text-align: center; color: #818cf8; font-weight: 600; padding: 20px; display: none; }
        footer { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="lang-switch">
                <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">English 🌐</button>
            </div>
            <div class="brand-badge" id="brandText">بيزنس ريفيو للاستشارات والتدريب</div>
            <h1 id="mainTitle">منصة الاستشارات الاستراتيجية الذكية</h1>
            <p class="desc" id="mainDesc">حول فكرتك إلى دراسة جدوى، أبحاث سوق، وخطة تنفيذية متكاملة بالذكاء الاصطناعي</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label id="labelApiKey" for="apiKey">مفتاح الربط (Gemini API Key) - اختياري:</label>
                <input type="password" id="apiKey" placeholder="أدخل مفتاح Gemini API هنا (اتركه فارغاً لاستخدام الوضع التجريبي)">
            </div>

            <div class="form-group">
                <label id="labelIdea" for="businessIdea">فكرة المشروع أو النشاط التجاري:</label>
                <textarea id="businessIdea" placeholder="مثال: إنشاء مصنع تجفيف فواكه وخضروات وأعشاب طبية في بني سويف..."></textarea>
            </div>

            <button class="btn" id="submitBtn" onclick="generateConsultingReport()">إنشاء التقرير الاستراتيجي الشامل</button>

            <div id="loadingIndicator" class="loading">
                ⏳ <span id="loadingText">جاري تحليل السوق، حساب التكاليف، وإعداد الأقسام السبعة الاستراتيجية... برجاء الانتظار لحظات.</span>
            </div>

            <div id="reportOutput" class="output-box"></div>
        </div>

        <footer id="footerText">
            جميع الحقوق محفوظة لصالح بيزنس ريفيو © 2026
        </footer>
    </div>

    <script>
        let currentLang = 'ar';

        const translations = {
            ar: {
                title: "بيزنس ريفيو | مستشار الأعمال والذكاء الاصطناعي",
                brand: "بيزنس ريفيو للاستشارات والتدريب",
                mainTitle: "منصة الاستشارات الاستراتيجية الذكية",
                mainDesc: "حول فكرتك إلى دراسة جدوى، أبحاث سوق، وخطة تنفيذية متكاملة بالذكاء الاصطناعي",
                labelApiKey: "مفتاح الربط (Gemini API Key) - اختياري:",
                placeholderApi: "أدخل مفتاح Gemini API هنا (اتركه فارغاً لاستخدام الوضع التجريبي)",
                labelIdea: "فكرة المشروع أو النشاط التجاري:",
                placeholderIdea: "مثال: إنشاء مصنع تجفيف فواكه وخضروات وأعشاب طبية في بني سويف، يستهدف السوق المحلي والتصدير...",
                submitBtn: "إنشاء التقرير الاستراتيجي الشامل",
                loadingText: "جاري تحليل السوق، حساب التكاليف، وإعداد الأقسام السبعة الاستراتيجية... برجاء الانتظار لحظات.",
                footer: "جميع الحقوق محفوظة لصالح بيزنس ريفيو © 2026",
                langBtnText: "English 🌐",
                alertMsg: "الرجاء كتابة فكرة المشروع أولاً!"
            },
            en: {
                title: "Business Review | AI Business Consultant",
                brand: "Business Review Consulting & Training",
                mainTitle: "Smart Strategic Advisory Platform",
                mainDesc: "Transform your business idea into a comprehensive feasibility study, market research, and execution roadmap using AI",
                labelApiKey: "API Key (Gemini API Key) - Optional:",
                placeholderApi: "Enter Gemini API key here (leave blank for demo mode)",
                labelIdea: "Business Idea or Venture Concept:",
                placeholderIdea: "Example: Establishing a fruit, vegetable, and medicinal herb drying facility in Beni Suef, targeting local and export markets...",
                submitBtn: "Generate Comprehensive Strategic Report",
                loadingText: "Analyzing market, calculating costs, and preparing the 7 strategic sections... Please wait.",
                footer: "All Rights Reserved to Business Review © 2026",
                langBtnText: "العربية 🌐",
                alertMsg: "Please enter your business idea first!"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const root = document.getElementById('htmlRoot');
            const t = translations[currentLang];

            root.setAttribute('lang', currentLang);
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('brandText').innerText = t.brand;
            document.getElementById('mainTitle').innerText = t.mainTitle;
            document.getElementById('mainDesc').innerText = t.mainDesc;
            document.getElementById('labelApiKey').innerText = t.labelApiKey;
            document.getElementById('apiKey').placeholder = t.placeholderApi;
            document.getElementById('labelIdea').innerText = t.labelIdea;
            document.getElementById('businessIdea').placeholder = t.placeholderIdea;
            document.getElementById('submitBtn').innerText = t.submitBtn;
            document.getElementById('loadingText').innerText = t.loadingText;
            document.getElementById('footerText').innerText = t.footer;
            document.getElementById('langToggleBtn').innerText = t.langBtnText;
        }

        async function generateConsultingReport() {
            const idea = document.getElementById('businessIdea').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const outputBox = document.getElementById('reportOutput');
            const loading = document.getElementById('loadingIndicator');
            const t = translations[currentLang];

            if (!idea) {
                alert(t.alertMsg);
                return;
            }

            outputBox.style.display = 'none';
            loading.style.display = 'block';

            if (apiKey) {
                try {
                    const langPrompt = currentLang === 'ar' ? 'باللغة العربية' : 'in English';
                    const systemPrompt = `You are 'VentureAI Master' – a top strategic business consultant and feasibility study expert. Generate a comprehensive professional report ${langPrompt} clearly structured into 7 sections: 1. Comprehensive Feasibility Study, 2. Market Research & Competitor Analysis, 3. Business Model, 4. GTM & Marketing Strategy, 5. Operational & Legal Framework, 6. Risk Management, 7. Execution Roadmap.`;
                    
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: `${systemPrompt}\n\nProject Concept: ${idea}` }]
                            }]
                        })
                    });

                    const data = await response.json();
                    loading.style.display = 'none';
                    outputBox.style.display = 'block';

                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        outputBox.innerText = data.candidates[0].content.parts[0].text;
                    } else {
                        outputBox.innerText = currentLang === 'ar' ? 'حدث خطأ في الاتصال بالخدمة، يرجى التأكد من مفتاح الـ Gemini API.' : 'Error connecting to service, please check your Gemini API key.';
                    }
                } catch (error) {
                    loading.style.display = 'none';
                    outputBox.style.display = 'block';
                    outputBox.innerText = 'Error: ' + error.message;
                }
            } else {
                setTimeout(() => {
                    loading.style.display = 'none';
                    outputBox.style.display = 'block';
                    outputBox.innerText = currentLang === 'ar' ? 
                        `📋 التقرير الاستراتيجي التجريبي لفكرة: "${idea}"\n\nيرجى إدخال مفتاح الـ API لتوليد التقرير المخصص بالكامل.` :
                        `📋 Demo Strategic Report for: "${idea}"\n\nPlease enter an API key to generate a full report.`;
                }, 1200);
            }
        }
    </script>
</body>
            </html>
