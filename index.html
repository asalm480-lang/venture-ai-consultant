<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيزنس ريفيو | مستشار الأعمال والذكاء الاصطناعي</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            padding: 20px;
        }
        .wrapper {
            max-width: 900px;
            margin: 30px auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .brand-badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.15);
            color: #818cf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #fff;
        }
        p.desc {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e5e7eb;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #030712;
            color: #fff;
            font-size: 1rem;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .output-box {
            background: #030712;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            display: none;
            white-space: pre-wrap;
            font-size: 1rem;
            color: #e5e7eb;
            line-height: 1.8;
        }
        .loading {
            text-align: center;
            color: #818cf8;
            font-weight: 600;
            padding: 20px;
            display: none;
        }
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="brand-badge">بيزنس ريفيو للاستشارات والتدريب</div>
            <h1>منصة الاستشارات الاستراتيجية الذكية</h1>
            <p class="desc">حول فكرتك إلى دراسة جدوى، أبحاث سوق، وخطة تنفيذية متكاملة بالذكاء الاصطناعي</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="apiKey">مفتاح الربط (Claude API Key) - اختياري:</label>
                <input type="password" id="apiKey" placeholder="أدخل مفتاح الـ API هنا (اتركه فارغاً لاستخدام الوضع التجريبي الفوري)">
            </div>

            <div class="form-group">
                <label for="businessIdea">فكرة المشروع أو النشاط التجاري:</label>
                <textarea id="businessIdea" placeholder="مثال: إنشاء مصنع تجفيف فواكه وخضروات وأعشاب طبية في بني سويف، يستهدف السوق المحلي والتصدير..."></textarea>
            </div>

            <button class="btn" onclick="generateConsultingReport()">إنشاء التقرير الاستراتيجي الشامل</button>

            <div id="loadingIndicator" class="loading">
                ⏳ جاري تحليل السوق، حساب التكاليف، وإعداد الأقسام السبعة الاستراتيجية... برجاء الانتظار لحظات.
            </div>

            <div id="reportOutput" class="output-box"></div>
        </div>

        <footer>
            جميع الحقوق محفوظة لصالح بيزنس ريفيو © 2026
        </footer>
    </div>

    <script>
        async function generateConsultingReport() {
            const idea = document.getElementById('businessIdea').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const outputBox = document.getElementById('reportOutput');
            const loading = document.getElementById('loadingIndicator');

            if (!idea) {
                alert('الرجاء كتابة فكرة المشروع أولاً!');
                return;
            }

            outputBox.style.display = 'none';
            loading.style.display = 'block';

            // إذا أدخل المستخدم مفتاح API حقيقي لـ Anthropic
            if (apiKey) {
                try {
                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-key": apiKey,
                            "anthropic-version": "2023-06-01",
                            "anthropic-dangerous-direct-browser-access": "true"
                        },
                        body: JSON.stringify({
                            model: "claude-3-5-sonnet-20241022",
                            max_tokens: 4000,
                            system: "أنت 'VentureAI Master' – مستشار أعمال استراتيجي وخبير دراسات جدوى. عند تلقي أي فكرة مشروع، اكتب فوراً تقريراً احترافياً وشاملاً باللغة العربية مقسماً بوضوح إلى الأقسام السبعة التالية: 1. دراسة الجدوى الشاملة، 2. أبحاث السوق وتحليل المنافسين، 3. نموذج العمل التجاري، 4. الهوية التسويقية وخطة الدخول للسوق، 5. الإطار التشغيلي والقانوني، 6. إدارة المخاطر، 7. خطة التنفيذ المرحلية. بدون مقدمات جانبية أو أسئلة.",
                            messages: [{ role: "user", content: `قم بإعداد التقرير الاستراتيجي الشامل للفكرة التالية: ${idea}` }]
                        })
                    });

                    const data = await response.json();
                    loading.style.display = 'none';
                    outputBox.style.display = 'block';

                    if (data.content && data.content[0]) {
                        outputBox.innerText = data.content[0].text;
                    } else {
                        outputBox.innerText = 'حدث خطأ في الاتصال بالخدمة، يرجى التأكد من مفتاح الـ API.';
                    }
                } catch (error) {
                    loading.style.display = 'none';
                    outputBox.style.display = 'block';
                    outputBox.innerText = 'حدث خطأ شبكي أثناء الاتصال: ' + error.message;
                }
            } else {
                // وضع المحاكاة الاحترافي المتقدم (Demo Mode) في حال عدم إدخال مفتاح
                setTimeout(() => {
                    loading.style.display = 'none';
                    outputBox.style.display = 'block';
                    outputBox.innerText = `📋 التقرير الاستراتيجي الشامل لفكرة: "${idea}"\n` +
                    `صادر عن: بيزنس ريفيو للاستشارات والتدريب\n\n` +
                    `1. دراسة الجدوى الشاملة:\n` +
                    `- تقدير رأس المال الأولي والاستثمارات الرأسمالية المطلوبة.\n` +
                    `- تحليل التدفقات النقية المتوقعة وفترة استرداد رأس المال ونقطة التعادل (Break-even Point).\n\n` +
                    `2. أبحاث السوق وتحليل المنافسين:\n` +
                    `- تحديد حجم السوق المستهدف والشرائح الديموغرافية والشرائية.\n` +
                    `- تحليل نقاط القوة والضعف للمنافسين ورصد الفجوات التسويقية (Market Gaps).\n\n` +
                    `3. نموذج العمل التجاري (Business Model):\n` +
                    `- قنوات الإيرادات المتعددة وهيكل التكاليف الثابتة والمتغيرة.\n` +
                    `- شركاء النجاح الأساسيون وقنوات التوزيع B2B و B2C.\n\n` +
                    `4. هوية العلامة التجارية وخطة الترويج (GTM):\n` +
                    `- استراتيجية التسويق الرقمي وإدارة المحتوى على المنصات المستهدفة.\n` +
                    `- رسالة البراند والقيمة المضافة الموجهة للعميل النهائي.\n\n` +
                    `5. الإطار التشغيلي والشئون القانونية:\n` +
                    `- التراخيص والتصاريح الحكومية المطلوبة وفق الكواد المنظمة (مثل GAFI والجهات المعنية).\n` +
                    `- الهيكل الإداري وسير العمليات اليومية (Operations Flow).\n\n` +
                    `6. إدارة المخاطر وخطط التخفيف:\n` +
                    `- رصد المخاطر التشغيلية، المالية، والسوقية المحتملة.\n` +
                    `- وضع خطط بديلة واحترازية لضمان استمرارية الأعمال (Business Continuity).\n\n` +
                    `7. خططة التنفيذ المرحلية (Execution Roadmap):\n` +
                    `- خط زمني تفصيلي مقسم على مراحل (من التأسيس والإطلاق حتى التوسع الإقليمي).\n\n` +
                    `💡 ملاحظة تفعيل الـ API: لإصدار تقارير مخصصة حية بالكامل عبر نموذج Claude، يمكنك إدخال مفتاح الـ API الخاص بك في الخانة بالأعلى وسيقوم بالنظام بتوليد التقرير لحظياً.`;
                }, 1500);
            }
        }
    </script>
</body>
</html>
