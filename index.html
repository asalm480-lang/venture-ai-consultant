<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">بيزنس ريفيو | مستشار الأعمال والذكاء الاصطناعي</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; padding: 20px; }
        .wrapper { max-width: 950px; margin: 30px auto; }
        header { text-align: center; margin-bottom: 40px; position: relative; }
        .lang-switch { position: absolute; top: 0; left: 0; }
        [dir="ltr"] .lang-switch { left: auto; right: 0; }
        .lang-btn { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .brand-badge { display: inline-block; background: rgba(79, 70, 229, 0.15); color: #818cf8; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; border: 1px solid rgba(79, 70, 229, 0.3); }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #fff; }
        p.desc { color: var(--text-muted); font-size: 1.1rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #e5e7eb; text-align: right; }
        [dir="ltr"] label { text-align: left; }
        input[type="password"], textarea { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); background: #030712; color: #fff; font-size: 1rem; text-align: right; }
        [dir="ltr"] input[type="password"], [dir="ltr"] textarea { text-align: left; }
        textarea { height: 150px; resize: vertical; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 28px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: all 0.3s ease; }
        .btn:hover { background: var(--primary-hover); }
        .output-box { background: #030712; border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-top: 30px; display: none; white-space: pre-wrap; font-size: 1.05rem; color: #f3f4f6; line-height: 2; text-align: right; direction: rtl; }
        [dir="ltr"] .output-box { text-align: left; direction: ltr; }
        .loading { text-align: center; color: #818cf8; font-weight: 600; padding: 25px; display: none; }
        footer { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="lang-switch">
                <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">English 🌐</button>
            </div>
            <div class="brand-badge" id="brandText">بيزنس ريفيو للاستشارات والتدريب</div>
            <h1 id="mainTitle">منصة الاستشارات الاستراتيجية الذكية</h1>
            <p class="desc" id="mainDesc">حول فكرتك إلى دراسة جدوى، أبحاث سوق، وخطة تنفيذية متكاملة باحترافية تامة</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label id="labelApiKey" for="apiKey">مفتاح الربط (Gemini API Key) - اختياري:</label>
                <input type="password" id="apiKey" placeholder="أدخل مفتاح Gemini API أو اتركه فارغاً...">
            </div>

            <div class="form-group">
                <label id="labelIdea" for="businessIdea">فكرة المشروع أو النشاط التجاري:</label>
                <textarea id="businessIdea" placeholder="مثال: إنشاء مصنع تجفيف فواكه وخضروات وأعشاب طبية في بني سويف، يستهدف السوق المحلي والتصدير..."></textarea>
            </div>

            <button class="btn" id="submitBtn" onclick="generateConsultingReport()">إنشاء التقرير الاستراتيجي الشامل</button>

            <div id="loadingIndicator" class="loading">
                ⏳ <span id="loadingText">جاري إعداد دراسة الجدوى التحليلية العميقة وبناء الأقسام السبعة الاستراتيجية... برجاء الانتظار لحظات.</span>
            </div>

            <div id="reportOutput" class="output-box"></div>
        </div>

        <footer id="footerText">
            جميع الحقوق محفوظة لصالح بيزنس ريفيو © 2026
        </footer>
    </div>

    <script>
        let currentLang = 'ar';

        const translations = {

                title: "بيزنس ريفيو | مستشار الأعمال والذكاء الاصطناعي",

                labelApiKey: "مفتاح الربط (Gemini API Key) - اختياري:",
                placeholderApi: "أدخل مفتاح Gemini API أو اتركه فارغاً...",
                labelIdea: "فكرة المشروع أو النشاط التجاري:",

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';

            const t = translations[currentLang];

            root.setAttribute('lang', currentLang);

            document.getElementById('loadingText').innerText = t.loadingText;
            document.getElementById('footerText').innerText = t.footer;
            document.getElementById('langToggleBtn').innerText = t.langBtnText;
        }

                        `• المخاطر التسويقية: دخول منافسين جدد أو تغير تفضيلات المستهلكين (البدائل: الابتكار المستمر والتنويع في سلة المنتجات والخدمات).\n\n` +
                        `-------------------------------------------------------------------------\n` +

                        `-------------------------------------------------------------------------\n` +
                        `• المرحلة الأولى (التأسيس وهندسة المشروع): الشهور (1 - 3)\n` +
                        `  - استكمال الدراسات التفصيلية، التعاقد على التمويل والموقع، استخراج التراخيص، والبدء في أعمال التجهيز والتركيب.\n` +
                        `• المرحلة الثانية (الإطلاق التجريبي وبناء الهوية): الشهور (4 - 5)\n` +
                        `  - التشغيل التجريبي لخطوط الإنتاج أو المنظومة الخدمية، اختبار الكفاءة والجودة، إطلاق الحملات التسويقية والترويجية الأولى.\n` +
                        `• المرحلة الثالثة (التوسع والتشغيل الكامل والنمو): الشهر السادس فصاعداً\n` +
